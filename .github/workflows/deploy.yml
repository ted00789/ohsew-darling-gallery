name: Deploy to Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build
      - name: Prepare static files
        run: |
          for d in dist dist/client .output/public build; do
            if [ -f "$d/index.html" ] || [ -f "$d/_shell.html" ]; then OUT="$d"; break; fi
          done
          if [ -z "$OUT" ]; then
            echo "No output folder found. Listing:"
            find . -name "index.html" -not -path "./node_modules/*"
            find . -name "_shell.html" -not -path "./node_modules/*"
            ls -la
            exit 1
          fi
          echo "Using $OUT"
          cp -r "$OUT" site
          cd site
          if [ ! -f index.html ]; then cp _shell.html index.html; fi
          cp index.html 404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
